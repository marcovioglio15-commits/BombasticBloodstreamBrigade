<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
      }

      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: {{{ BACKGROUND_COLOR }}};
      }

      #unity-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        background: #050505;
      }

      #unity-progress-track {
        width: min(320px, 70vw);
        height: 8px;
        border: 1px solid #dedede;
        background: #202020;
      }

      #unity-progress-bar {
        width: 0;
        height: 100%;
        background: #f0c913;
      }

      #unity-progress-label {
        color: #f4f4f4;
        font: 14px Arial, sans-serif;
        text-align: center;
      }

      #unity-fullscreen-button {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 4px;
        color: #fff;
        background: rgba(0, 0, 0, 0.58);
        font: 24px/34px Arial, sans-serif;
        cursor: pointer;
      }

      #unity-warning {
        position: absolute;
        top: 8px;
        left: 50%;
        z-index: 2;
        transform: translateX(-50%);
        color: #111;
        font: 13px Arial, sans-serif;
      }

      #unity-container:fullscreen,
      #unity-container:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
      }
    </style>
    <script>
      (function installBombasticWebGLGuard() {
        var contexts = [];
        var NativeAudioContext = window.AudioContext || window.webkitAudioContext;

        function ignoreKnownBrowserAudioError(error) {
          var name = error && error.name ? String(error.name) : "";
          var message = error && error.message ? String(error.message) : String(error || "");
          return name === "InvalidAccessError" ||
                 message.indexOf("destination is not connected") >= 0 ||
                 message.indexOf("Permission check failed") >= 0;
        }

        function settle(promise) {
          if (promise && typeof promise.catch === "function") {
            promise.catch(function (error) {
              if (!ignoreKnownBrowserAudioError(error))
                console.warn(error);
            });
          }
        }

        if (NativeAudioContext) {
          function GuardedAudioContext() {
            var context = Reflect.construct(NativeAudioContext, arguments, new.target || GuardedAudioContext);
            contexts.push(context);
            return context;
          }

          GuardedAudioContext.prototype = NativeAudioContext.prototype;
          Object.setPrototypeOf(GuardedAudioContext, NativeAudioContext);
          window.AudioContext = GuardedAudioContext;

          if (window.webkitAudioContext)
            window.webkitAudioContext = GuardedAudioContext;
        }

        if (window.AudioNode && window.AudioNode.prototype && window.AudioNode.prototype.disconnect) {
          var nativeDisconnect = window.AudioNode.prototype.disconnect;
          window.AudioNode.prototype.disconnect = function () {
            try {
              return nativeDisconnect.apply(this, arguments);
            } catch (error) {
              if (ignoreKnownBrowserAudioError(error))
                return;

              throw error;
            }
          };
        }

        function resumeAudio() {
          for (var index = 0; index < contexts.length; index++) {
            var context = contexts[index];

            if (context && context.state === "suspended")
              settle(context.resume());
          }
        }

        function handleRejectedPermission(error) {
          if (ignoreKnownBrowserAudioError(error))
            return;

          console.warn(error);
        }

        window.BombasticWebGLGuard = {
          resumeAudio: resumeAudio,
          handleRejectedPermission: handleRejectedPermission,
          isKnownBrowserError: ignoreKnownBrowserAudioError
        };

        window.addEventListener("pointerdown", resumeAudio, true);
        window.addEventListener("touchend", resumeAudio, true);
        window.addEventListener("keydown", resumeAudio, true);
        window.addEventListener("focus", resumeAudio, true);
        document.addEventListener("fullscreenchange", resumeAudio, true);
        document.addEventListener("webkitfullscreenchange", resumeAudio, true);
        window.addEventListener("unhandledrejection", function (event) {
          if (!ignoreKnownBrowserAudioError(event.reason))
            return;

          event.preventDefault();
        });
      })();
    </script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading">
        <div id="unity-progress-track">
          <div id="unity-progress-bar"></div>
        </div>
        <div id="unity-progress-label">Loading 0%</div>
      </div>
      <button id="unity-fullscreen-button" type="button" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var loading = document.querySelector("#unity-loading");
      var progressBar = document.querySelector("#unity-progress-bar");
      var progressLabel = document.querySelector("#unity-progress-label");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      function unityShowBanner(message, type) {
        if (window.BombasticWebGLGuard.isKnownBrowserError(message))
          return;

        var warningBanner = document.querySelector("#unity-warning");
        var item = document.createElement("div");
        item.textContent = message;
        item.style = type === "error"
          ? "background:#d13a3a;padding:8px;color:#fff"
          : "background:#f0c913;padding:8px;color:#111";
        warningBanner.appendChild(item);

        if (type !== "error") {
          setTimeout(function () {
            item.remove();
          }, 5000);
        }
      }

      function requestBombasticFullscreen() {
        window.BombasticWebGLGuard.resumeAudio();
        var request = container.requestFullscreen ||
                      container.webkitRequestFullscreen ||
                      container.msRequestFullscreen;

        if (!request)
          return;

        try {
          var result = request.call(container);

          if (result && typeof result.catch === "function")
            result.catch(window.BombasticWebGLGuard.handleRejectedPermission);
        } catch (error) {
          window.BombasticWebGLGuard.handleRejectedPermission(error);
        }
      }

      fullscreenButton.addEventListener("click", requestBombasticFullscreen);
      canvas.addEventListener("pointerdown", function () {
        window.BombasticWebGLGuard.resumeAudio();
        canvas.focus();
      });

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        errorHandler: function (error) {
          return window.BombasticWebGLGuard.isKnownBrowserError(error);
        }
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percentage = Math.round(progress * 100);
          progressBar.style.width = percentage + "%";
          progressLabel.textContent = "Loading " + percentage + "%";
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
          window.BombasticWebGLGuard.resumeAudio();
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
